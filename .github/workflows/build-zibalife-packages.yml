name: Build ZibaLife Body Article Packages

on:
  push:
    branches: [main]
    paths:
      - 'content/125-pharyngeal-tonsil-how-it-works-fa.md'
      - 'content/126-lingual-tonsil-how-it-works-fa.md'
      - 'art/125-pharyngeal-tonsil-how-it-works-featured-image.svg'
      - 'art/126-lingual-tonsil-how-it-works-featured-image.svg'
      - '.github/workflows/build-zibalife-packages.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zip

      - name: Render final PNG files
        run: |
          mkdir -p build/125 build/126 release
          rsvg-convert -w 1536 -h 1024 art/125-pharyngeal-tonsil-how-it-works-featured-image.svg -o build/125/125-pharyngeal-tonsil-how-it-works-featured-image.png
          rsvg-convert -w 1536 -h 1024 art/126-lingual-tonsil-how-it-works-featured-image.svg -o build/126/126-lingual-tonsil-how-it-works-featured-image.png
          cp content/125-pharyngeal-tonsil-how-it-works-fa.md build/125/
          cp content/126-lingual-tonsil-how-it-works-fa.md build/126/

      - name: Validate and build article 125 ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile
          root=Path('build/125')
          md=root/'125-pharyngeal-tonsil-how-it-works-fa.md'
          png=root/'125-pharyngeal-tonsil-how-it-works-featured-image.png'
          expected=sorted([md.name,png.name])
          files=sorted(p.name for p in root.iterdir() if p.is_file())
          assert files==expected
          data=png.read_bytes(); assert data[:8]==b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',data[16:24]); assert (w,h)==(1536,1024)
          text=md.read_text(encoding='utf-8'); assert png.name in text; assert 'sources_count: 5' in text
          z=Path('release/125-pharyngeal-tonsil-how-it-works-fa.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              out.write(md,md.name); out.write(png,png.name)
          with zipfile.ZipFile(z) as check:
              assert sorted(check.namelist())==expected
              assert check.testzip() is None
          print('PASS 125', expected, (w,h), z.stat().st_size)
          PY

      - name: Validate and build article 126 ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile
          root=Path('build/126')
          md=root/'126-lingual-tonsil-how-it-works-fa.md'
          png=root/'126-lingual-tonsil-how-it-works-featured-image.png'
          expected=sorted([md.name,png.name])
          files=sorted(p.name for p in root.iterdir() if p.is_file())
          assert files==expected
          data=png.read_bytes(); assert data[:8]==b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',data[16:24]); assert (w,h)==(1536,1024)
          text=md.read_text(encoding='utf-8'); assert png.name in text; assert 'sources_count: 5' in text
          z=Path('release/126-lingual-tonsil-how-it-works-fa.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              out.write(md,md.name); out.write(png,png.name)
          with zipfile.ZipFile(z) as check:
              assert sorted(check.namelist())==expected
              assert check.testzip() is None
          print('PASS 126', expected, (w,h), z.stat().st_size)
          PY

      - name: Store validated ZIP files on repository branch
        run: |
          cat > release/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>ZibaLife packages</title></head><body>
          <a href="125-pharyngeal-tonsil-how-it-works-fa.zip">125-pharyngeal-tonsil-how-it-works-fa.zip</a>
          <a href="126-lingual-tonsil-how-it-works-fa.zip">126-lingual-tonsil-how-it-works-fa.zip</a>
          </body></html>
          HTML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/125-pharyngeal-tonsil-how-it-works-fa.zip release/126-lingual-tonsil-how-it-works-fa.zip release/index.html
          git commit -m "Store validated ZibaLife 125-126 packages" || true
          git push origin HEAD:main

      - name: Publish ZIP files as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zibalife-body-125-126"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ZibaLife Body Articles 125-126" --notes "Validated two-file article packages."
          gh release upload "$TAG" release/125-pharyngeal-tonsil-how-it-works-fa.zip release/126-lingual-tonsil-how-it-works-fa.zip --clobber

      - name: Upload article 125 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 125-pharyngeal-tonsil-how-it-works-fa
          path: |
            build/125/125-pharyngeal-tonsil-how-it-works-fa.md
            build/125/125-pharyngeal-tonsil-how-it-works-featured-image.png
          if-no-files-found: error
          compression-level: 9

      - name: Upload article 126 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 126-lingual-tonsil-how-it-works-fa
          path: |
            build/126/126-lingual-tonsil-how-it-works-fa.md
            build/126/126-lingual-tonsil-how-it-works-featured-image.png
          if-no-files-found: error
          compression-level: 9
